{% extends "base.html" %}
{% block title %}{{ status_code }} · Memory Layer{% endblock %}
{% block body %}
<section class="hero">
  <div class="hero-copy">
    <div class="eyebrow">{{ status_code }} / {{ eyebrow }}</div>
    <h1>{{ headline }}</h1>
    <p>{{ message }}</p>
    <div class="nav" style="margin-top:24px">
      <a href="/" class="button primary">Return home</a>
      <a href="/docs" class="button">Read docs</a>
      <a href="/status" class="button">Check status</a>
    </div>
  </div>
  <div class="terminal-surface">
    <div class="terminal-row"><span>{{ route_label }}</span><div><code>{{ path }}</code></div></div>
    <div class="terminal-row"><span>{{ panel_title }}</span><div>{{ panel_text }}</div></div>
  </div>
</section>
{% endblock %}
