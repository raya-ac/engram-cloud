[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-cloud"
version = "0.3.0"
description = "Hosted multi-workspace service layer for Engram"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
classifiers = [
  "License :: Other/Proprietary License",
]
dependencies = [
  "engram-memory-system @ git+https://github.com/raya-ac/engram.git@bec09d48858fcac554648410285e793131f2c915",
  "mythic-cognition-runtime @ git+https://github.com/raya-ac/mythic.git@0bb4b173a8fa597c94472df476a75af4ed150578",
  "jsonschema>=4.23.0",
  "fastapi==0.136.3",
  "starlette==1.1.0",
  "anyio==4.12.1",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "authlib>=1.3.1",
  "httpx>=0.27.0,<2",
  "httpx2==2.12.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.0",
  "itsdangerous>=2.2.0",
  "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  "ignore:authlib.jose module is deprecated.*:authlib.deprecate.AuthlibDeprecationWarning",
]
